<section class="m-2 p-8 bg-olive-300 rounded">
    <h2 class="title">Nueva tarea</h2>
    <div class="flex justify-between gap-4">
        <input  type="text"
                [(ngModel)] = "title"
                placeholder="Escribe una tarea" 
                class=" border rounded border-olive-500 bg-gray-100 px-2 w-full"
        />
        <button (click)="addTask()"
                class="button" 
        >
            Añadir
        </button>
    </div>
</section>
